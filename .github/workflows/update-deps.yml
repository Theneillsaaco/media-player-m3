name: Update NuGet deps.json

on: 
  push:
    paths:
      - '**/*.csproj'
      - '**/*.fsproj'
  workflow_dispatch:

jobs:
  update-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        
      - name: Build fetch-deps script
        run: nix build .#default.fetch-deps
        
      - name: Regenerate deps.json
        run: ./result deps.json
        
      - name: Create Pull Request if changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(deps): auto-update deps.json"
          title: "chore(deps): update deps.json due to .NET project changes"
          body: "Automatic update of NuGet dependencies generated due to modifications in `.csproj` or `.fsproj` files."
          branch: automated/update-deps-json
          delete-branch: true
          labels: |
            dependencies
            automated
          reviewers: Theneillsaaco
          assignees: Theneillsaaco
